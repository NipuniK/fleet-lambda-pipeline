version: "3.8"

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://fleet:fleet@postgres:5432/fleet
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth"
    PIPELINE_DB_URL: postgresql+psycopg2://fleet:fleet@postgres:5432/fleet
    KAFKA_BOOTSTRAP: kafka:9092
    SIM_DAY_SECONDS: ${SIM_DAY_SECONDS:-300}
    AIRFLOW_CONN_SPARK_DEFAULT: '{"conn_type": "spark", "host": "local[*]"}'
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./processing:/opt/airflow/processing
    - ./common:/opt/airflow/common
    - ./producers/drops:/opt/airflow/producers_drops
    - airflow_logs:/opt/airflow/logs
  depends_on:
    - postgres

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on: [zookeeper]
    ports: ["9092:9092"]
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_MULTIPLE_DATABASES: fleet,airflow
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    ports: ["5432:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./storage/init:/docker-entrypoint-initdb.d

  spark-master:
    image: apache/spark:3.5.0
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports: ["7077:7077", "8081:8080"]

  spark-worker:
    image: apache/spark:3.5.0
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    depends_on: [spark-master]

  producers:
    build:
      context: .
      dockerfile: producers/Dockerfile
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      SIM_DAY_SECONDS: ${SIM_DAY_SECONDS:-300}
    depends_on: [kafka]
    volumes:
      - ./producers/drops:/app/drops
    command: ["python", "run_both.py"]

  speed-layer:
    build:
      context: .
      dockerfile: processing/Dockerfile
    depends_on: [kafka, postgres]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      PIPELINE_DB_URL: postgresql+psycopg2://fleet:fleet@postgres:5432/fleet
      IDLE_ALERT_SECONDS: 600
      NO_DATA_ALERT_SECONDS: 30
    command: ["python3", "speed_layer.py"]

  alert-watcher:
    build:
      context: .
      dockerfile: processing/Dockerfile
    depends_on: [kafka, postgres]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      PIPELINE_DB_URL_RAW: "dbname=fleet user=fleet password=fleet host=postgres"
      IDLE_ALERT_SECONDS: 10
      NO_DATA_ALERT_SECONDS: 10
    command: ["python3", "idle_alert_watcher.py"]

  api:
    build:
      context: .
      dockerfile: serving/Dockerfile
    depends_on: [postgres]
    ports: ["8000:8000"]
    environment:
      PIPELINE_DB_URL: postgresql+psycopg2://fleet:fleet@postgres:5432/fleet

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password admin --firstname a --lastname a --role Admin --email admin@example.com"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    depends_on: [airflow-init]

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on: [airflow-init]

volumes:
  pg_data:
  airflow_logs:
